# Generated by chap-devops from .chap-devops/; edit there and run `chap-devops sync`.
# {{ id }} {{ version }} ({{ repository }})
services:
  {{ service_id }}:
{{ labels }}    restart: unless-stopped
    image: {{ image }}{{ tag_sep }}${ {{- tag_var }}:-{{ image_tag }}}
{# A local image has no registry behind it, so `compose pull` skips it. #}
{% if local %}
    pull_policy: never
{% endif %}
{# An amd64-only image runs under emulation on an arm64 host. #}
{% if platform is not none %}
    platform: {{ platform }}
{% endif %}
    init: true
    expose:
      - "{{ container_port }}"
{% if host_port is not none %}
    ports:
      - "{{ bind }}{{ host_port }}:{{ container_port }}"
{% endif %}
{#
  Without chap-core there is nothing to register with: servicekit skips the
  registration when SERVICEKIT_ORCHESTRATOR_URL is unset. A chap-core elsewhere
  is registered with over the host gateway, and it calls the model back at the
  host and the published port. `$$register` is a literal `$` for compose.
#}
{% if external or not standalone %}
    environment:
{% if external %}
      SERVICEKIT_ORCHESTRATOR_URL: {{ register_url }}/v2/services/$$register
      SERVICEKIT_HOST: {{ models_host }}
{% if host_port is not none %}
{% if reads_port %}
      PORT: "{{ host_port }}"
{% endif %}
      SERVICEKIT_PORT: "{{ host_port }}"
{% endif %}
{% else %}
      SERVICEKIT_ORCHESTRATOR_URL: http://chap:8000/v2/services/$$register
{% endif %}
{% if registration_key %}
      SERVICEKIT_REGISTRATION_KEY: ${SERVICEKIT_REGISTRATION_KEY:-}
{% else %}
      # Uncomment if chap has SERVICEKIT_REGISTRATION_KEY set:
      # SERVICEKIT_REGISTRATION_KEY: ${SERVICEKIT_REGISTRATION_KEY:-}
{% endif %}
{% if external %}
    extra_hosts:
      - "{{ host_gateway }}:host-gateway"
{% endif %}
{% endif %}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
{% if user is not none %}
    user: {{ user }}
{% endif %}
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 2000000000
      - type: volume
        source: {{ volume }}
        target: {{ data_dir }}
    depends_on:
      {{ service_id }}-init:
        condition: service_completed_successfully
{% if not external and not standalone %}
      chap:
        condition: service_healthy
{% endif %}

{#
  Every model gets the init container, root included: a volume that exists
  already carries whoever owned it last, and the overlay drops the capability
  that lets root ignore the permission bits. The chown is recursive for the
  same reason. busybox resolves no account name, so the pair is numeric.
#}
  {{ service_id }}-init:
{{ labels }}    image: busybox:1.38
    command: ["sh", "-c", "chown -R {{ uid_gid }} {{ data_dir }}"]
    user: "0:0"
    volumes:
      - type: volume
        source: {{ volume }}
        target: {{ data_dir }}
    restart: "no"

volumes:
  {{ volume }}: {}
