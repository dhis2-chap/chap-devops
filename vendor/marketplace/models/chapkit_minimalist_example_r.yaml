    chapkit: ">=2.2.0,<3"
    status: verified
    # Pinned by the maintainers without the three-approval round (CLIM-1745).
    verified_by: []
    changelog: >-
      Builds on the chapkit-r-inla base image pinned by digest in the Dockerfile, so the commit fixes the base image it was built on. No change to the model.
  - version: 1.0.3
    commit: 1abf9887fe4c624b43fdead8b79b1b0f362542c1
    image_tag: sha-1abf988
    image_digest: sha256:db56c9728170eb493c85527a2375c1c603c06176dcb9be671d5698a4b977705b
    chapkit: ">=2.2.0,<3"
    status: verified
    # Pinned by the maintainers without the three-approval round (security fix).
