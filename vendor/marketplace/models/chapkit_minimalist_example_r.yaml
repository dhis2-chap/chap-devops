      Metrics on /metrics now use the stable OpenTelemetry names (http_server_request_duration_seconds_*). Built on chapkit 2.2.0 and servicekit 3.0.0. No change to the model.
  - version: 1.0.1
    commit: 9fbdd09494fd74d6a55b1c9bef33a2d479cdb402
    image_tag: sha-9fbdd09
    image_digest: sha256:d61aaeb7d4a82a11a59c7564dab93f0b405db0190e3c9248496c1a0c19e22df0
